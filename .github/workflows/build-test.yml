name: SIMHAE Build & Test

on:
  pull_request:
    branches:
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Dockerfile Lint & Build Check
        run: |
          # FastAPI Dockerfile
          docker build --no-cache --pull -t simhae-fastapi-test -f Dockerfile .